name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (Roslynator)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
      - run: dotnet restore Hero-sArena.csproj
      - run: dotnet tool restore
      - run: dotnet roslynator analyze Hero-sArena.csproj

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
      - run: dotnet restore Hero-sArena.csproj
      - run: dotnet build Hero-sArena.csproj --configuration Release --no-restore /p:RunAnalyzers=true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
      - run: dotnet restore Hero-sArena.csproj
      - run: dotnet build Hero-sArena.csproj --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
      - run: dotnet restore tests/HeroArena.Tests/HeroArena.Tests.csproj
      - run: dotnet test tests/HeroArena.Tests/HeroArena.Tests.csproj --configuration Release --no-restore --filter "Category!=GodotRuntime"

  godot-verify:
    name: Godot Verify & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Download Godot 4.3 mono (C#-enabled) headless
        run: |
          mkdir -p godot
          cd godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.3-stable_mono_linux_x86_64.zip
          chmod +x Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64
          ln -s "$PWD/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64" "$PWD/godot"
          echo "$PWD" >> $GITHUB_PATH

      - name: Verify Godot runs
        run: godot --version

      - name: Godot headless build verification
        run: godot --headless --quit

      - name: Run Godot core system tests
        # The mono engine locates the .NET host fxr via DOTNET_ROOT;
        # setup-dotnet 8.0.x put dotnet on PATH, so derive its root from there.
        run: DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")") godot --headless res://tests/GodotTests/CoreSystemTests.tscn

      - name: Scene smoke (headless boot of every main scene)
        # Fails if any main scene throws C# exception frames at boot — catches
        # missing node_paths wiring / invalid node types that unit tests miss.
        run: DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")") bash tools/smoke_scenes.sh

  export:
    name: Export (Linux/Windows/macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test, godot-verify]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Export DOTNET_ROOT for the mono engine
        # Exporting a C# project invokes dotnet build; the mono engine also
        # needs DOTNET_ROOT to locate hostfxr (same as the godot-verify job).
        run: echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> $GITHUB_ENV

      - name: Download Godot 4.3 mono (C#-enabled) headless
        run: |
          mkdir -p godot
          cd godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.3-stable_mono_linux_x86_64.zip
          chmod +x Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64
          ln -s "$PWD/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64" "$PWD/godot"
          echo "$PWD" >> $GITHUB_PATH

      - name: Download Godot 4.3 export templates
        # The .tpz archive has a `templates/` root directory; Godot expects
        # the template files DIRECTLY under export_templates/4.3.stable/.
        # Unzipping in place nested them one level too deep, and the export
        # would fail with "no export template found".
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cd ~/.local/share/godot/export_templates
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates 4.3.stable

      - name: Export for Linux (headless server test)
        run: godot --headless --export-release "Linux/X11" build/linux/HeroArena.x86_64

      - name: Export for Windows
        run: godot --headless --export-release "Windows Desktop" build/windows/HeroArena.exe

      - name: Export for macOS
        run: godot --headless --export-release "macOS" build/macos/HeroArena.app

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HeroArena-Linux
          path: build/linux/
          retention-days: 7

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HeroArena-Windows
          path: build/windows/
          retention-days: 7

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HeroArena-macOS
          path: build/macos/
          retention-days: 7

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Check for TODO/FIXME comments in production code
        # Must fail the job on a match. `find -exec grep` returns find's exit
        # code, so the previous form passed vacuously even with TODOs present.
        run: |
          if grep -rni --include="*.cs" -E "TODO|FIXME" scripts/; then
            echo "Quality gate failed: TODO/FIXME markers found in scripts/"
            exit 1
          fi
          echo "Quality gate passed: no TODO/FIXME markers in scripts/"
